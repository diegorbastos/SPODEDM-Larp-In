name: Verificacao nativa Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - run: chmod +x android/gradlew
      - name: Compilar aplicativo e modulo Android
        run: cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain
